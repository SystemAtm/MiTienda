  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0B3A5B; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; display: block; background: #fff; }

    /* Pantalla de carga (se va sola cuando el sistema termina de abrir) */
    #carga { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden;
      background:
        radial-gradient(60% 70% at 8% 12%, #22D3EE 0%, transparent 60%),
        radial-gradient(55% 60% at 92% 8%, #A5F3FC 0%, transparent 62%),
        radial-gradient(60% 65% at 85% 95%, #0A84FF 0%, transparent 60%),
        radial-gradient(55% 60% at 15% 92%, #93C5FD 0%, transparent 62%),
        linear-gradient(135deg, #22D3EE, #A5F3FC 35%, #93C5FD 70%, #0A84FF);
      transition: opacity .45s ease, visibility .45s; }
    #carga.listo { opacity: 0; visibility: hidden; }
    .tarjeta { background: rgba(255,255,255,.78); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.7); border-radius: 26px; padding: 30px 34px 26px; text-align: center;
      box-shadow: 0 24px 60px rgba(11,58,91,.25); width: min(330px, 86vw); }
    .tarjeta img { width: 150px; height: auto; display: block; margin: 0 auto 4px; }
    .marca { font-weight: 800; font-size: 38px; letter-spacing: -.02em; color: #0B3A5B; line-height: 1.1; }
    .marca b { color: #0A84FF; }
    .texto { margin: 14px 0 0; color: #3b5770; font-size: 14px; min-height: 20px; }
    .barra { height: 6px; border-radius: 99px; background: rgba(10,132,255,.15); overflow: hidden; margin-top: 12px; }
    .barra i { display: block; height: 100%; width: 40%; border-radius: 99px; background: linear-gradient(90deg, #22D3EE, #0A84FF); animation: corre 1.2s ease-in-out infinite; }
    @keyframes corre { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    .respaldo { display: none; margin-top: 16px; }
    .respaldo.ver { display: block; }
    .respaldo a { display: inline-block; text-decoration: none; background: #0A84FF; color: #fff; font-weight: 700; padding: 11px 18px; border-radius: 12px; font-size: 14px; }
    .respaldo small { display: block; margin-top: 8px; color: #557189; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { .barra i { animation: none; width: 100%; } }
  </style>
</head>

    setTimeout(function () { if (!listo) document.getElementById('texto').textContent = 'Conectando con Google…'; }, 4000);
    setTimeout(function () { if (!listo) { document.getElementById('texto').textContent = 'Está tardando más de lo normal.'; document.getElementById('respaldo').classList.add('ver'); } }, 15000);
  </script>
</body>
</html>
